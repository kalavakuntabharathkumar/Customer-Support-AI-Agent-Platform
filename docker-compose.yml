services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: local_demo_password
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: local-compose-key-change-before-deploy
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://support_agent:local_demo_password@db:5432/support_agent
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn support_agent.wsgi:application --bind 0.0.0.0:8000 --workers 2"
volumes:
  postgres_data:
